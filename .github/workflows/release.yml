name: Automated Semantic Release

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  security-scan:
    name: Security & Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install System Dependencies
        run: sudo apt-get update && sudo apt-get install -y shellcheck shfmt yamllint jq python3-yaml python3-pytest bats

      - name: Run ShellCheck
        run: |
          echo "🔍 Running ShellCheck..."
          find .bash.d -type f -name "*.sh" -print0 | xargs -0 shellcheck -e SC1090,SC1091,SC2119,SC2120,SC2207,SC2015,SC2317,SC2016,SC2129,SC2028,SC1003
          shellcheck -e SC1090,SC1091,SC2119,SC2120,SC2207,SC2015,SC2317,SC2016,SC2129,SC2028,SC1003 install.sh .bashrc

      - name: Verify Formatting (shfmt)
        run: |
          echo "🎨 Verifying Google Shell Style..."
          shfmt -d -i 2 -ci -sr .

      - name: Run Ruff Python Linter
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          args: "check ."

      - name: Run Python Test Suite
        run: |
          echo "🧪 Running pytest..."
          python3 -m pytest tests/python/ -v

      - name: Run Bash Test Suite
        run: |
          echo "🧪 Running bats..."
          bats tests/bash/

      - name: Verify Dockerfile (Hadolint)
        uses: hadolint/hadolint-action@2a66e89f53d0771bb131a7fa31f3136336094aa6 # v3.4.0
        with:
          dockerfile: Dockerfile

      - name: Validate JSON and YAML Syntax
        run: |
          echo "🔍 Validating JSON files..."
          find . -name "*.json" -not -path "./.devcontainer/*" -print0 | xargs -0 -I {} jq empty {}

          echo "🔍 Validating YAML files..."
          find . \( -name "*.yaml" -o -name "*.yml" \) -not -path "*/lib/blueprints/*" -print0 | xargs -0 yamllint -d "{extends: relaxed, rules: {line-length: disable}}"

  build-and-release:
    name: Build and Release
    needs: [lint, security-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Calculate SemVer and Push Tag
        id: tag_version
        uses: mathieudutour/github-tag-action@a22cf08638b34d5badda920f9daf6e72c477b07b # v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          tag_prefix: v

      - name: Package Repository Zip
        run: |
          ZIP_NAME="mt-devops-framework-${{ steps.tag_version.outputs.new_tag }}.zip"
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV

          zip -r "$ZIP_NAME" . -x ".git/*" -x ".git" -x ".github/*" -x "venv/*" -x "*/__pycache__/*" -x ".terraform/*" -x "*.tfstate*"

      - name: Smoke-Test Packaged Release Install
        run: |
          echo "🧪 Verifying the packaged release installs cleanly and matches the source tree..."
          EXTRACT_DIR=$(mktemp -d)
          TEST_HOME=$(mktemp -d)
          unzip -q "$ZIP_NAME" -d "$EXTRACT_DIR"

          # Seed a pre-existing .bashrc so the .bashrc.bak guard exercised
          # in the update-simulation pass below has something real to back
          # up -- a fresh empty $TEST_HOME never triggers it.
          printf '# pre-framework bashrc\n' > "$TEST_HOME/.bashrc"

          # Decline the interactive bootstrap prompt -- this test verifies the
          # file sync, not system package installation.
          echo n | HOME="$TEST_HOME" bash "$EXTRACT_DIR/install.sh"

          echo "🔍 Diffing installed .bash.d against the source tree..."
          if ! diff -rq .bash.d "$TEST_HOME/.bash.d" \
            --exclude=data --exclude=config.yaml \
            --exclude=.env.cache --exclude="*_token.sh" \
            --exclude=".syncignore" --exclude=".current_version"; then
            echo "::error::Installed .bash.d tree does not match the source tree -- the release package is missing files that should have shipped."
            exit 1
          fi

          echo "✅ Smoke-test passed: packaged release installs and matches source."

          echo "🧪 Simulating mt-get-update: re-running install.sh over the already-installed tree..."
          # A second pass over the same $TEST_HOME is what mt-get-update
          # does on every real update. This is the only place that catches
          # regressions a fresh-install-only smoke test can't: the
          # .bashrc.bak guard double-writing, or rsync --delete silently
          # wiping local-only files (config.yaml, *_token.sh, 40-private/,
          # lib/private/) that only exist once a tree is already installed.
          printf 'export MY_API_TOKEN=abc123\n' > "$TEST_HOME/.bash.d/config/ci_test_token.sh"
          mkdir -p "$TEST_HOME/.bash.d/40-private" "$TEST_HOME/.bash.d/lib/private"
          printf 'echo "private"\n' > "$TEST_HOME/.bash.d/40-private/custom.sh"
          printf 'echo "private"\n' > "$TEST_HOME/.bash.d/lib/private/helper.sh"
          bashrc_bak_before=$(md5sum "$TEST_HOME/.bashrc.bak" | cut -d' ' -f1)

          echo n | HOME="$TEST_HOME" bash "$EXTRACT_DIR/install.sh"

          if [ "$(md5sum "$TEST_HOME/.bashrc.bak" | cut -d' ' -f1)" != "$bashrc_bak_before" ]; then
            echo "::error::.bashrc.bak changed on a second install.sh run -- it should only ever be written once."
            exit 1
          fi
          for f in config/ci_test_token.sh 40-private/custom.sh lib/private/helper.sh; do
            if [ ! -f "$TEST_HOME/.bash.d/$f" ]; then
              echo "::error::install.sh's second pass deleted local-only file $f -- rsync --delete regression."
              exit 1
            fi
          done

          echo "✅ Update-simulation smoke-test passed: second install.sh pass preserves local state."

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ steps.tag_version.outputs.new_tag }}
          name: Release ${{ steps.tag_version.outputs.new_tag }}
          body: |
            ## 🚀 What's Changed in ${{ steps.tag_version.outputs.new_tag }}

            ${{ steps.tag_version.outputs.changelog }}

            ---
            ### 📦 Installation & Updating
            To update or install this release directly from your terminal, run:
            ```bash
            mt-get-update -v ${{ steps.tag_version.outputs.new_tag }}
            ```
          generate_release_notes: true
          files: ${{ env.ZIP_NAME }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
